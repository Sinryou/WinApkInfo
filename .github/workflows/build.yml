name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Windows runners default to cp1252; test output contains Chinese.
  PYTHONIOENCODING: utf-8

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Locate aapt2 from Android SDK
        uses: ./.github/actions/locate-aapt2

      - name: Run linter (ruff check)
        run: python -m ruff check .

      - name: Run tests (pytest)
        run: python -m pytest tests -v -ra

  build:
    name: build (${{ matrix.mode }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [onedir, onefile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Locate aapt2 from Android SDK
        uses: ./.github/actions/locate-aapt2

      # lint 与测试已由 test job 完成，这里只打包（内部仍会跑产物 --self-test）
      - name: Build and package
        shell: pwsh
        run: .\build.ps1 -Mode ${{ matrix.mode }} -Aapt2Path $env:AAPT2_PATH -Clean -SkipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinApkInfo-${{ matrix.mode }}
          path: |
            dist/*.zip
            # dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            # dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
