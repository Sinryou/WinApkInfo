[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501", # Line too long
]

[tool.ruff.lint.per-file-ignores]
# conftest 先改 sys.path 再导入 core./ui.，模块级导入无法置于文件顶部
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: 需要 testSample/ 真实样本的端到端用例（默认构建不运行）",
]
